name: Compile UML diagrams

on:
  push:
    paths:
      - "Task*/**/src/**/*.uml"
      - "Task*/**/src/**/*.puml"
      - "Task*/**/*.uml"
      - "Task*/**/*.puml"
      - "Task*/README.md"
      - ".github/workflows/compile-uml.yml"
  pull_request:
    paths:
      - "Task*/**/src/**/*.uml"
      - "Task*/**/src/**/*.puml"
      - "Task*/**/*.uml"
      - "Task*/**/*.puml"
      - "Task*/README.md"
      - ".github/workflows/compile-uml.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Discover Task directories
        id: tasks
        run: |
          set -euo pipefail
          shopt -s nullglob

          tasks=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tasks=(Task*/)
          else
            before="${{ github.event.before }}"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base_ref="${{ github.event.pull_request.base.sha }}"
              changed="$(git diff --name-only "$base_ref"..."${{ github.sha }}" || true)"
            elif [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              changed="$(git diff --name-only "$before"..."${{ github.sha }}" || true)"
            else
              changed="$(git diff --name-only HEAD~1..."${{ github.sha }}" 2>/dev/null || true)"
            fi

            while IFS= read -r line; do
              [[ "$line" =~ ^(Task[0-9]+)/ ]] || continue
              tasks+=("${BASH_REMATCH[1]}/")
            done <<< "$changed"

            if ((${#tasks[@]} > 0)); then
              mapfile -t tasks < <(printf '%s\n' "${tasks[@]}" | sort -u)
            fi
          fi

          if ((${#tasks[@]} == 0)); then
            tasks=(Task*/)
          fi

          if ((${#tasks[@]} == 0)); then
            echo "No Task* directories found."
            echo "tasks=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          names=()
          for t in "${tasks[@]}"; do
            names+=("${t%/}")
          done
          echo "Found: ${names[*]}"
          echo "tasks=${names[*]}" >> "$GITHUB_OUTPUT"

      - name: Compile PlantUML sources to SVG
        if: steps.tasks.outputs.tasks != ''
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          total=0
          for task in ${{ steps.tasks.outputs.tasks }}; do
            echo "::group::Compiling UML in $task"

            # Prefer sources under any $task/**/src/ tree; fall back to
            # loose .uml/.puml files directly under $task/ for compatibility.
            files=("$task"/**/src/**/*.{uml,puml})
            if ((${#files[@]} == 0)); then
              files=("$task"/*.{uml,puml})
            fi
            if ((${#files[@]} == 0)); then
              echo "No UML sources in $task — skipping."
              echo "::endgroup::"
              continue
            fi

            count=0
            for src in "${files[@]}"; do
              base="$(basename "$src")"
              name="${base%.*}"
              src_dir="$(dirname "$src")"
              # Sources in .../src/foo.uml -> SVG at .../foo.svg
              # Loose sources in TaskN/foo.uml -> SVG at TaskN/foo.svg
              if [[ "$src_dir" == */src ]]; then
                out_dir="$(dirname "$src_dir")"
              else
                out_dir="$src_dir"
              fi
              out="${out_dir}/${name}.svg"
              echo "Compiling $src -> $out"
              docker run --rm -i plantuml/plantuml:latest -tsvg -pipe < "$src" > "$out"
              count=$((count + 1))
            done

            echo "Compiled ${count} diagram(s) in $task."
            total=$((total + count))
            echo "::endgroup::"
          done

          echo "Compiled ${total} diagram(s) total."

      - name: Setup Node.js
        if: steps.tasks.outputs.tasks != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate ReportN.pdf from each TaskN/README.md
        if: steps.tasks.outputs.tasks != ''
        run: |
          set -euo pipefail

          pdf_opts='{"format":"A4","margin":{"top":"20mm","right":"15mm","bottom":"20mm","left":"15mm"},"printBackground":true}'
          # GitHub-hosted runners disable the Chromium sandbox; required for Puppeteer.
          launch_opts='{"args":["--no-sandbox","--disable-setuid-sandbox"]}'

          for task in ${{ steps.tasks.outputs.tasks }}; do
            echo "::group::PDF for $task"
            if [[ ! -f "$task/README.md" ]]; then
              echo "No README.md in $task — skipping PDF."
              echo "::endgroup::"
              continue
            fi

            # Task1 -> Report1.pdf, Task12 -> Report12.pdf
            num="${task#Task}"
            out="Report${num}.pdf"

            (
              cd "$task"
              npx --yes md-to-pdf README.md \
                --pdf-options "$pdf_opts" \
                --launch-options "$launch_opts"
              mv -f README.pdf "$out"
              ls -lh "$out"
            )
            echo "::endgroup::"
          done

      - name: Upload SVG artifacts
        if: steps.tasks.outputs.tasks != ''
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: |
            Task*/**/*.svg
            Task*/*.svg
          if-no-files-found: ignore

      - name: Upload report PDFs
        if: steps.tasks.outputs.tasks != ''
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: Task*/Report*.pdf
          if-no-files-found: ignore

      - name: Commit regenerated diagrams and reports
        # Skip on pull_request / when nothing changed
        if: github.event_name != 'pull_request' && steps.tasks.outputs.tasks != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          paths=()
          for task in ${{ steps.tasks.outputs.tasks }}; do
            mapfile -t svgs < <(find "$task" -type f -name '*.svg' -print)
            if ((${#svgs[@]} > 0)); then
              paths+=("${svgs[@]}")
            fi
            num="${task#Task}"
            pdf="$task/Report${num}.pdf"
            if [[ -f "$pdf" ]]; then
              paths+=("$pdf")
            fi
          done

          if ((${#paths[@]} == 0)); then
            echo "Nothing to commit."
            exit 0
          fi

          git add "${paths[@]}"
          if git diff --staged --quiet; then
            echo "SVG/PDF outputs are already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate UML SVGs and task report PDFs"
          git push
