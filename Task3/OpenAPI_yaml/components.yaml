components:
  schemas:
    compute-group:
      type: object
      properties:
        computeGroupId:
          type: UUID
        cpuCores:
          type: integer
        createdAt:
          type: string
          format: date
        gpuCount:
          type: integer
        name:
          type: string
        ramBytes:
          type: integer
        status:
          type: string
    permission:
      type: object
      properties:
        id:
          description: Action identifier
          type: UUID
        isAllowed:
          type: boolean
    storage-group:
      type: object
      properties:
        storageGroupId:
          type: UUID
        createdAt:
          type: string
          format: date
        hostPath:
          type: string
        name:
          type: string
        quotaBytes:
          type: integer
        status:
          type: string
        usedBytes:
          type: integer
    user:
      type: object
      properties:
        id:
          type: UUID
        username:
          type: string
        tier:
          description: Current account tier
          type: integer
        status:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/permission'

    responses:
      GeneralError:
        type: object
        properties:
          code:
            type: integer
            format: int32
          message:
            type: string
      DataInvalidError:
        type: object
        properties:
          code:
            type: integer
            format: int32
          field:
            type: string
          message:
            type: string

    securitySchemes:
        BearerAuth:
          type: http
          scheme: bearer

          