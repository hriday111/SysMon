/v1/compute-groups:
  get:
	  summary: Gets all compute groups in the database.
    security:
    - BearerAuth
	  responses:
			"200":
				description: A list of compute groups.
				content:
					application/json:
						schema:
							type: array
							items:
                $ref: '#/components/schemas/compute-group'
      "401":
        description: Token-related error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/GeneralError'
      "403":
        description: Error - insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/GeneralError'
  post:
    summary: Creates a new compute group.
    security:
    - BearerAuth
    responses:
      "201":
				description: Returns the new compute group's data.
				content:
					application/json:
						schema:
              $ref: '#/components/schemas/compute-group'      
      "401":
        description: Token-related error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/GeneralError'
      "403":
        description: Error - user is not a tier 1 or 2 admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/GeneralError'
      "422":
        description: Error - data invalid or host hardware capacity exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/DataInvalidError'
      "409":
        description: Error - group name is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/GeneralError'
  parameters:
  - name:
      in: header
      required: false
      schema:
        type: string
  - cpuCores:
      in: header
      required: false
      schema:
        type: integer
  - ramBytes:
      in: header
      required: false
      schema:
        type: integer
  - gpuCount:
      in: header
      required: false
      schema:
        type: integer

/v1/compute-groups/{computeGroupId}:
  patch:
    summary: Modifies an existing compute group.
    security:
    - BearerAuth
    responses:
      "200":
				description: Returns the new compute group's data.
				content:
					application/json:
						schema:
              $ref: '#/components/schemas/compute-group'
      "401":
        description: Token-related error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/GeneralError'
      "403":
        description: Error - user is not a tier 1 or 2 admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/GeneralError'
      "404":
        description: Error - group does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/GeneralError'
      "422":
        description: Error - data invalid or host hardware capacity exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses/DataInvalidError'
  delete:
    summary: Deletes a compute group.
    security:
    - BearerAuth
    responses:
      "204":
        description: Deletion successful.
      "401":
        description: Token-related error.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/responses/GeneralError'
      "403":
        description: Error - user is not a tier 1 or 2 admin.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/responses/GeneralError'
      "404":
        description: Error - group does not exist.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/responses/GeneralError'
      "409":
        description: Error - group has users or running deployments assigned.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/responses/GeneralError'
  parameters:
  - cpuCores:
      in: header
      required: false
      schema:
        type: integer
  - ramBytes:
      in: header
      required: false
      schema:
        type: integer
  - gpuCount:
      in: header
      required: false
      schema:
        type: integer